AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RecipeSharingApp — Week 1 skeleton (API Gateway, Lambdas, RDS, S3, CloudWatch alarm stubs)

Parameters:
  DBPassword:
    Type: String
    NoEcho: true
    Description: Master password for the RDS MySQL instance
  JWTSecret:
    Type: String
    NoEcho: true
    Description: Secret used to sign JWTs
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic API key for Claude calls
  DefaultVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-08c7ca324ca084924
    Description: >-
      VPC for RecipeDB's security group. No Lambda in this stack has VpcConfig
      (the mealplan consumer needs public internet for the Claude API, and
      this VPC has no NAT gateway), so RecipeDB is PubliclyAccessible instead
      of Lambda-only-reachable — this SG is what that decision hinges on.
      Defaults to this AWS account's default VPC in us-east-2.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        DB_HOST: !GetAtt RecipeDB.Endpoint.Address
        DB_PORT: !GetAtt RecipeDB.Endpoint.Port
        DB_NAME: recipesharing
        DB_USER: admin
        DB_PASSWORD: !Ref DBPassword
        JWT_SECRET: !Ref JWTSecret
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey

Resources:
  RecipeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Name: recipe-sharing-api
      # multipart/form-data added so API Gateway passes the recipe-photo
      # upload body through as binary instead of mangling it as text.
      BinaryMediaTypes:
        - multipart/form-data
      Cors:
        AllowOrigin: "'http://localhost:5173'"
        AllowHeaders: "'Content-Type'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: recipe-sharing-shared
      ContentUri: ../backend/layer/
      CompatibleRuntimes:
        - python3.13
    Metadata:
      BuildMethod: python3.13

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: health/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /health
            Method: get

  RdsTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: rds_test/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/auth/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /auth/login
            Method: post

  RecipesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/recipes/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      # Needed for the S3 photo upload/read flow in this function only —
      # doesn't touch the shared layer or other functions.
      Environment:
        Variables:
          PHOTOS_BUCKET: !Ref RecipePhotosBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref RecipePhotosBucket
      Events:
        ListRecipes:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /recipes
            Method: get
        CreateRecipe:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /recipes
            Method: post
        GetRecipe:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: "/recipes/{recipe_id}"
            Method: get
        UpdateRecipe:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: "/recipes/{recipe_id}"
            Method: put
        DeleteRecipe:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: "/recipes/{recipe_id}"
            Method: delete
        RateRecipe:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: "/recipes/{recipe_id}/ratings"
            Method: post
        SaveRecipe:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: "/recipes/{recipe_id}/save"
            Method: post
        UploadRecipePhoto:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: "/recipes/{recipe_id}/photo"
            Method: post

  MealplanQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: recipe-sharing-mealplan-queue
      VisibilityTimeout: 60

  MealplanGenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/mealplan/
      Handler: generate.lambda_handler
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          MEALPLAN_QUEUE_URL: !Ref MealplanQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MealplanQueue.QueueName
      Events:
        GenerateMealplan:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /mealplan/generate
            Method: post

  MealplanFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/mealplan/
      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      Events:
        MealplanQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MealplanQueue.Arn
            BatchSize: 1

  RecipeDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        Inbound MySQL for RecipeDB. Public on purpose, protection is the DB
        password alone, not network isolation. Scoped to this stack, not
        the accounts shared default SG.
      VpcId: !Ref DefaultVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0

  RecipeDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: '8.0.46'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      DBName: recipesharing
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      PubliclyAccessible: true
      VPCSecurityGroups:
        - !GetAtt RecipeDbSecurityGroup.GroupId
      BackupRetentionPeriod: 1

  RecipePhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "recipe-sharing-photos-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "http://localhost:5173"
            AllowedMethods: [GET, PUT, POST]
            AllowedHeaders: ["*"]

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: recipe-sharing-alarms

  Api5xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: recipe-sharing-api-5xx-rate
      AlarmDescription: "TBD — threshold set in Week 3"
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: recipe-sharing-api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

  ApiP95LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: recipe-sharing-api-p95-latency
      AlarmDescription: "TBD — threshold set in Week 3"
      Namespace: AWS/ApiGateway
      MetricName: Latency
      ExtendedStatistic: p95
      Dimensions:
        - Name: ApiName
          Value: recipe-sharing-api
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

  MealplanDlqFailureRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: recipe-sharing-mealplan-dlq-failure-rate
      AlarmDescription: "TBD — threshold set in Week 3. References a DLQ that does not exist yet; the mealplan track has not been built."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: recipe-sharing-mealplan-dlq
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  MealplanGenerationTimeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: recipe-sharing-mealplan-generation-time
      AlarmDescription: "TBD — threshold set in Week 3. References a custom metric emitted by the mealplan consumer Lambda, not built yet."
      Namespace: RecipeSharing/Mealplan
      MetricName: GenerationDurationMs
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ApiUrl:
    Value: !Sub "https://${RecipeApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"
  PhotosBucketName:
    Value: !Ref RecipePhotosBucket
  MealplanQueueUrl:
    Value: !Ref MealplanQueue